[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-report"
version = "0.2.0"
description = "Explain SQL Server xml_deadlock_report graphs as text"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Avery Lane"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.scripts]
deadlock-report = "deadlock_report.cli:main"

[tool.setuptools]
packages = ["deadlock_report"]
